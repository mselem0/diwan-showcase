<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="description" content="محرك إلقاء الشعر العربي — ابحث عن قصيدة واستمع إلى إلقائها مباشرةً" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f0f0f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23cc2200'/%3E%3Cpolygon points='26,22 26,42 46,32' fill='white'/%3E%3C/svg%3E"
    />
    <title>مِشكاة — محرك إلقاء الشعر العربي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ═══ TOPBAR ═══ -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="18" cy="18" r="18" fill="#cc2200"/>
          <polygon points="14,11 14,25 27,18" fill="white"/>
        </svg>
        <div class="brand-text">
          <b>مِشكاة</b>
          <small>محرك إلقاء الشعر العربي</small>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          type="search"
          data-search
          placeholder="ابحث عن قصيدة أو شاعر…"
          autocomplete="off"
          aria-label="البحث في الديوان"
        />
        <kbd>⌘K</kbd>
      </div>
      <nav class="topbar-actions">
        <button class="connection-btn" data-open-settings>
          <i class="conn-dot"></i>
          <span data-status>غير متصل</span>
        </button>
      </nav>
    </header>

    <!-- ═══ FILTERS BAR ═══ -->
    <div class="filters-bar">
      <label class="filter-label">
        <span>النمط</span>
        <select data-filter-style>
          <option value="">الكل</option>
          <option value="vertical">عمودي</option>
          <option value="prose">نثري</option>
          <option value="free_verse">تفعيلة</option>
        </select>
      </label>
      <label class="filter-label">
        <span>العصر</span>
        <select data-filter-era>
          <option value="">الكل</option>
        </select>
      </label>
      <label class="filter-label">
        <span>البحر</span>
        <select data-filter-meter>
          <option value="">الكل</option>
        </select>
      </label>
      <div class="pagination">
        <button class="pag-btn" data-prev aria-label="الصفحة السابقة">→</button>
        <span data-page class="pag-label">1</span>
        <button class="pag-btn" data-next aria-label="الصفحة التالية">←</button>
      </div>
    </div>

    <!-- ═══ APP SHELL ═══ -->
    <div class="app-shell">

      <!-- Results Panel -->
      <aside class="results-panel" aria-label="نتائج البحث">
        <div class="results-list" data-results-list>
          <div class="initial-state">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="24" r="24" fill="#1a1a1a"/>
              <circle cx="24" cy="24" r="15" fill="#cc2200"/>
              <polygon points="19,16 19,32 34,24" fill="white"/>
            </svg>
            <p>ابحث عن قصيدة أو شاعر<br/>للاستماع إلى إلقائها</p>
          </div>
        </div>
      </aside>

      <!-- Viewer Panel -->
      <section class="viewer-panel" aria-label="مشغّل القصيدة">

        <!-- Player Zone -->
        <div class="player-zone">
          <div class="player-placeholder" data-player-placeholder>
            <div class="placeholder-inner">
              <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
                <circle cx="40" cy="40" r="40" fill="#1a1a1a"/>
                <circle cx="40" cy="40" r="28" fill="#cc2200" opacity="0.15"/>
                <circle cx="40" cy="40" r="20" fill="#cc2200" opacity="0.3"/>
                <polygon points="34,30 34,50 54,40" fill="#cc2200"/>
              </svg>
              <p>اختر قصيدة من القائمة لتشغيل إلقائها</p>
            </div>
          </div>
          <div class="player-frame" data-player-frame hidden></div>
          <div class="player-fallback" data-player-fallback hidden></div>
        </div>

        <!-- Poem Content -->
        <div class="poem-content" data-poem-view hidden>
          <header class="poem-header">
            <div class="poem-style-badge" data-poem-style-badge></div>
            <h1 class="poem-title" data-poem-title></h1>
            <div class="poem-byline">
              <span class="poem-poet" data-poem-poet></span>
              <span class="byline-dot" aria-hidden="true">·</span>
              <span data-poem-era></span>
              <span class="byline-dot" aria-hidden="true">·</span>
              <span data-poem-meter></span>
            </div>
          </header>
          <div class="poem-tools" role="toolbar" aria-label="أدوات القراءة">
            <button data-font-down title="تصغير الخط">أ−</button>
            <button data-font-up title="تكبير الخط">أ+</button>
            <button data-toggle-diacritics>بلا تشكيل</button>
            <button data-copy>نسخ ◎</button>
          </div>
          <div class="poem-lines" data-poem-lines></div>
          <a class="attribution" data-attribution target="_blank" rel="noopener"></a>
        </div>

      </section>
    </div>

    <!-- ═══ SETTINGS DIALOG ═══ -->
    <dialog class="settings-dialog" data-settings>
      <form method="dialog"><button class="dialog-close" aria-label="إغلاق">×</button></form>
      <div class="dialog-icon">
        <svg viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="18" fill="#cc2200"/>
          <polygon points="14,11 14,25 27,18" fill="white"/>
        </svg>
      </div>
      <h2>مِشكاة API</h2>
      <p class="dialog-note">
        هذه صفحة عامة. استخدم مفتاح اختبار مقيّدًا بالنطاق
        <code>https://mselem0.github.io</code>.
      </p>
      <label class="dialog-field">
        Base URL
        <input data-base-url dir="ltr" value="https://api.aldiwan.net/api/v1" />
      </label>
      <label class="dialog-field">
        API Key
        <input data-api-key dir="ltr" type="password" autocomplete="off" placeholder="aldiwan_test_…" />
      </label>
      <div class="dialog-actions">
        <button class="btn-primary" data-connect>اتصل واختبر</button>
        <button class="btn-ghost" data-disconnect>قطع الاتصال</button>
      </div>
    </dialog>

    <!-- ═══ API CONSOLE ═══ -->
    <aside class="api-console" data-api-console>
      <button class="console-toggle" data-console-toggle>
        <span>API LIVE CONSOLE</span><i>▸</i>
      </button>
      <div class="console-body">
        <div><span>الطلب</span><code data-console-endpoint>—</code></div>
        <div><span>الحالة</span><b data-console-code>—</b></div>
        <div><span>الوقت</span><b data-console-time>—</b></div>
        <div><span>المتبقي</span><b data-console-remaining>—</b></div>
      </div>
    </aside>

    <!-- ═══ TOAST ═══ -->
    <div class="toast" data-toast role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
